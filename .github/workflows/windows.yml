name: Windows portable build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test, build, launch and review package
        shell: powershell
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FolderPilot-v0.1.1-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/publication-check.json
          if-no-files-found: error
